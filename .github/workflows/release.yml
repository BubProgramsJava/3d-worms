name: Native release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.0
      include_macos:
        description: Build the Apple Silicon DMG (disable to recover during macOS runner shortages)
        type: boolean
        required: true
        default: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: >-
      ${{ matrix.platform == 'linux-x86_64' && 'ubuntu-24.04' ||
          matrix.platform == 'macos-aarch64' && 'macos-15' ||
          'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        # Tag pushes always build all platforms. Only an explicit manual recovery
        # can omit macOS when GitHub cannot allocate an Apple Silicon runner.
        platform: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && !inputs.include_macos &&
              '["linux-x86_64","windows-x86_64"]' ||
              '["linux-x86_64","macos-aarch64","windows-x86_64"]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Maven 3.10.1
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: '3.10.1'

      - name: Set up the Windows C++ toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the Linux C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential zlib1g-dev

      - name: Build the Linux image with GraalVM Native Image 25
        if: runner.os == 'Linux'
        run: mvn --batch-mode -Pnative-linux -DskipTests clean package

      - name: Build the macOS image with GraalVM Native Image 25
        if: runner.os == 'macOS'
        run: mvn --batch-mode -Pnative-macos -DskipTests clean package

      - name: Build the Windows image with GraalVM Native Image 25
        if: runner.os == 'Windows'
        run: mvn --batch-mode -Pnative-windows -DskipTests clean package

      - name: Package Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup 6 is required to build the Windows installer.'
          }
          $nativeDir = Join-Path $PWD 'target/native'
          $appIcon = Join-Path $PWD 'config/native/windows/worm-icon.ico'
          $releaseDir = Join-Path $PWD 'dist'
          $version = $env:RELEASE_TAG.Substring(1)
          $installerScript = Join-Path $env:RUNNER_TEMP '3d-worms.iss'
          # Keep the installer definition in the workflow so recovery runs can
          # package the original tagged sources with the corrected build tools.
          @'
          [Setup]
          AppId={{874AB831-0F3A-438F-A805-B1A605765293}
          AppName=3D Worms
          AppVersion={#AppVersion}
          AppPublisher=3D Worms
          AppSupportURL=https://github.com/BubProgramsJava/3d-worms/issues
          DefaultDirName={localappdata}\Programs\3D Worms
          DefaultGroupName=3D Worms
          DisableProgramGroupPage=yes
          OutputDir={#ReleaseDir}
          OutputBaseFilename=3d-worms-{#ReleaseTag}-windows-x86_64-setup
          ; Recovery runs can check out source tags from before the ICO was added.
          #if FileExists(AppIcon)
          SetupIconFile={#AppIcon}
          #endif
          UninstallDisplayIcon={app}\3d-worms.exe
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest

          [Files]
          Source: "{#NativeDir}\3d-worms.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\3D Worms"; Filename: "{app}\3d-worms.exe"

          [Run]
          Filename: "{app}\3d-worms.exe"; Description: "Launch 3D Worms"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -LiteralPath $installerScript -Encoding utf8
          & $compiler "/DAppVersion=$version" "/DReleaseTag=$env:RELEASE_TAG" "/DNativeDir=$nativeDir" "/DAppIcon=$appIcon" "/DReleaseDir=$releaseDir" $installerScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS app bundle and disk image
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          # Recovery runs check out an older tag whose package-app.sh may lack later fixes.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch --no-tags origin "${{ github.sha }}"
            git checkout "${{ github.sha }}" -- config/native/macos/package-app.sh
          fi
          config/native/macos/package-app.sh \
            --version "${RELEASE_TAG#v}" \
            --output-dir dist \
            --dmg-name "3d-worms-${RELEASE_TAG}-macos-aarch64.dmg"

      - name: Stage Windows native executable and installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $releaseDir = 'dist'
          $nativeDir = 'target/native'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $nativeExe = Join-Path $nativeDir '3d-worms.exe'
          if (-not (Test-Path -LiteralPath $nativeExe)) {
            throw "Native executable not found: $nativeExe"
          }
          $installer = Join-Path $releaseDir "3d-worms-$tag-windows-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Windows installer not found: $installer"
          }
          Copy-Item -LiteralPath $nativeExe -Destination (Join-Path $releaseDir "3d-worms-$tag-windows-x86_64.exe")

      - name: Verify the macOS disk image
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: test -f "dist/3d-worms-${RELEASE_TAG}-macos-aarch64.dmg"

      - name: Stage Linux native image
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -x target/native/3d-worms
          tar -czf "dist/3d-worms-${RELEASE_TAG}-linux-x86_64.tar.gz" -C target/native 3d-worms

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            target/native/**/*.log
            target/native/svm_err_*.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
          fi
