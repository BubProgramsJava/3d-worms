name: Native release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.0

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-aarch64
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-2022

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: ${{ runner.os == 'Linux' && 'graalvm-community' || 'graalvm' }}
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Maven 3.8.8
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: '3.8.8'

      - name: Set up the Windows C++ toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux JavaFX build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libxtst-dev libxrender-dev libxrandr-dev libxt-dev libxfixes-dev libxi-dev libxinerama-dev libfreetype6-dev libgl1-mesa-dev libpango1.0-dev libasound2-dev libavcodec-dev libavformat-dev libavutil-dev

      - name: Patch GraalVM Linux static library layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          library_dir="$GRAALVM_HOME/lib/svm/clibraries/linux-amd64"
          glibc_dir="$library_dir/glibc"
          if [[ -d "$glibc_dir" ]]; then
            for source in "$glibc_dir"/*; do
              [[ -f "$source" ]] || continue
              name="${source##*/}"
              [[ -e "$library_dir/$name" ]] || ln -s "glibc/$name" "$library_dir/$name"
            done
          fi
      - name: Build the native image
        run: mvn --batch-mode -Pnative-release -DskipTests clean package

      - name: Package Windows installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup 6 is required to build the Windows installer.'
          }
          $nativeDir = Join-Path $PWD 'target/gluonfx/x86_64-windows'
          $releaseDir = Join-Path $PWD 'dist'
          $version = $env:RELEASE_TAG.Substring(1)
          $installerScript = Join-Path $env:RUNNER_TEMP '3d-worms.iss'
          # Keep the installer definition in the workflow so recovery runs can
          # package the original tagged sources with the corrected build tools.
          @'
          [Setup]
          AppId={{874AB831-0F3A-438F-A805-B1A605765293}
          AppName=3D Worms
          AppVersion={#AppVersion}
          AppPublisher=3D Worms
          AppSupportURL=https://github.com/BubProgramsJava/3d-worms/issues
          DefaultDirName={localappdata}\Programs\3D Worms
          DefaultGroupName=3D Worms
          DisableProgramGroupPage=yes
          OutputDir={#ReleaseDir}
          OutputBaseFilename=3d-worms-{#ReleaseTag}-windows-x86_64-setup
          UninstallDisplayIcon={app}\3d-worms.exe
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest

          [Files]
          Source: "{#NativeDir}\3d-worms.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\3D Worms"; Filename: "{app}\3d-worms.exe"

          [Run]
          Filename: "{app}\3d-worms.exe"; Description: "Launch 3D Worms"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -LiteralPath $installerScript -Encoding utf8
          & $compiler "/DAppVersion=$version" "/DReleaseTag=$env:RELEASE_TAG" "/DNativeDir=$nativeDir" "/DReleaseDir=$releaseDir" $installerScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS disk image
        if: matrix.platform == 'macos-aarch64'
        run: mvn --batch-mode -Pnative-release -DskipTests -Dgluonfx.packageType=dmg gluonfx:package

      - name: Stage Windows native executable and installer
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $releaseDir = 'dist'
          $nativeDir = 'target/gluonfx/x86_64-windows'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $nativeExe = Join-Path $nativeDir '3d-worms.exe'
          if (-not (Test-Path -LiteralPath $nativeExe)) {
            throw "Native executable not found: $nativeExe"
          }
          $installer = Join-Path $releaseDir "3d-worms-$tag-windows-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Windows installer not found: $installer"
          }
          Copy-Item -LiteralPath $nativeExe -Destination (Join-Path $releaseDir "3d-worms-$tag-windows-x86_64.exe")

      - name: Stage macOS disk image
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image=$(find target/gluonfx/aarch64-darwin -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$image"
          cp "$image" "dist/3d-worms-${RELEASE_TAG}-macos-aarch64.dmg"

      - name: Stage Linux native image
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          binary=target/gluonfx/x86_64-linux/3d-worms
          test -f "$binary"
          tar -czf "dist/3d-worms-${RELEASE_TAG}-linux-x86_64.tar.gz" -C target/gluonfx/x86_64-linux 3d-worms

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            target/gluonfx/log/**
            target/gluonfx/**/gvm/log/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
          fi
